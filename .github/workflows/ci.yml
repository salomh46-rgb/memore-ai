name: Me'morAI CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite & Rules Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify ShNQ / QMQ Rules Engine (54 Rules)
        run: |
          python -m pytest rules/ -v

      - name: Verify CAD DXF Parser and Integration
        run: |
          python -m pytest tests/ -v

  security-scan:
    name: Secret Leakage & Static Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check for Uncommitted Secrets (.env files)
        run: |
          if [ -f ".env" ]; then
            echo "ERROR: .env file found in repo root! Hardcoded secrets are strictly prohibited."
            exit 1
          fi
          echo "✅ No local .env detected."

      - name: Scan for Exposed Bot Tokens & Sensitive Keys
        run: |
          # Reject commits with hardcoded Telegram Bot Tokens or private keys
          if grep -rE "[0-9]{9,10}:[a-zA-Z0-9_-]{35}" --exclude-dir={.git,.venv,node_modules} .; then
            echo "ERROR: Possible Telegram Bot Token found hardcoded in files!"
            exit 1
          fi
          echo "✅ Zero secret leakage verified."
