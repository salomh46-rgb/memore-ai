# ==============================================================================
# Me'morAI — Production Docker Compose Orchestration
# Services: api (FastAPI), worker (Celery), redis (Redis:7-alpine), nginx
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Web Application Service
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memore_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Tashkent
      - REDIS_URL=${REDIS_URL:-redis://:memore_redis_secret@redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://:memore_redis_secret@redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://:memore_redis_secret@redis:6379/1}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - memore_net

  # ----------------------------------------------------------------------------
  # 2. Celery Asynchronous Background Worker
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memore_worker
    restart: unless-stopped
    command: ["celery", "-A", "worker", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Tashkent
      - REDIS_URL=${REDIS_URL:-redis://:memore_redis_secret@redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://:memore_redis_secret@redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://:memore_redis_secret@redis:6379/1}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker inspect ping -d celery@$$HOSTNAME || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - memore_net

  # ----------------------------------------------------------------------------
  # 3. Redis In-Memory Task Broker & Cache
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: memore_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-memore_redis_secret}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-memore_redis_secret} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - memore_net

  # ----------------------------------------------------------------------------
  # 4. Nginx Reverse Proxy & Static Gate
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: memore_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/var/www/uploads:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx_health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - memore_net

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  redis_data:
    name: memore_redis_data
  uploads_data:
    name: memore_uploads_data
  logs_data:
    name: memore_logs_data

# ==============================================================================
# Isolated Bridge Network
# ==============================================================================
networks:
  memore_net:
    name: memore_network
    driver: bridge
