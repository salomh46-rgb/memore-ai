services:
  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    container_name: memore_landing
    restart: always
    ports:
      - "3010:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - memore_net
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.memore-landing-http.rule=Host(`memore.62.171.143.55.sslip.io`)"
      - "traefik.http.routers.memore-landing-http.entrypoints=http"
      - "traefik.http.routers.memore-landing.rule=Host(`memore.62.171.143.55.sslip.io`)"
      - "traefik.http.routers.memore-landing.entrypoints=https"
      - "traefik.http.routers.memore-landing.tls=true"
      - "traefik.http.routers.memore-landing.tls.certresolver=letsencrypt"
      - "traefik.http.services.memore-landing.loadbalancer.server.port=3000"

  bot:
    build:
      context: .
      dockerfile: telegram_bot/Dockerfile
    container_name: memore_bot
    restart: always
    env_file:
      - ./telegram_bot/.env
    volumes:
      - bot_data:/app/telegram_bot/data
    networks:
      - memore_net

  redis:
    image: redis:7-alpine
    container_name: memore_redis_prod
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_prod_data:/data
    networks:
      - memore_net
    # ports yo'q — faqat ichki tarmoq

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memore_worker_prod
    restart: always
    command: ["celery", "-A", "worker", "worker", "--loglevel=info", "--concurrency=2"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - memore_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memore_api
    restart: always
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - memore_net
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.memore-api.rule=Host(`api-memore.62.171.143.55.sslip.io`)"
      - "traefik.http.routers.memore-api.entrypoints=https"
      - "traefik.http.routers.memore-api.tls=true"
      - "traefik.http.routers.memore-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.memore-api.loadbalancer.server.port=8000"

volumes:
  redis_prod_data:
    name: memore_redis_prod_data
  uploads_data:
    name: memore_uploads_data
  logs_data:
    name: memore_logs_data
  bot_data:
    name: memore_bot_data

networks:
  memore_net:
    name: memore_network
    driver: bridge
  coolify:
    external: true
